auto_save: false
display_label_popup: true
store_data: true
keep_prev: false
keep_prev_scale: false
keep_prev_brightness: false
keep_prev_contrast: false
logger_level: info

flags: null
label_flags: null
labels: null
file_search: null
sort_labels: true
validate_label: null

default_shape_color: [0, 255, 0]
shape_color: auto  # null, 'auto', 'manual'
shift_auto_shape_color: 0
label_colors: null

shape:
  # drawing
  line_color: [0, 255, 0, 128]
  fill_color: [0, 0, 0, 64]
  vertex_fill_color: [0, 255, 0, 255]
  # selecting / hovering
  select_line_color: [255, 255, 255, 255]
  select_fill_color: [0, 255, 0, 64]
  hvertex_fill_color: [255, 255, 255, 255]
  point_size: 8

ai:
  default: 'EfficientSam (accuracy)'

segment_all:
  default: 'cellpose'

# main
flag_dock:
  show: true
  closable: true
  movable: true
  floatable: true
label_dock:
  show: true
  closable: true
  movable: true
  floatable: true
shortcuts_dock:
  show: false
  closable: true
  movable: true
  floatable: true
segmentation_dock:
  show: false
  closable: true
  movable: true
  floatable: true
shape_dock:
  show: true
  closable: true
  movable: true
  floatable: true
file_dock:
  show: true
  closable: true
  movable: true
  floatable: true

# label_dialog
show_label_text_field: true
label_completion: startswith
fit_to_content:
  column: true
  row: false

# canvas
epsilon: 10.0
canvas:
  fill_drawing: true
  # None: do nothing
  # close: close polygon
  double_click: close
  # The max number of edits we can undo
  num_backups: 10
  # show crosshair
  crosshair:
    rectangle: true
    erase: true
    brush: false
    circle: false
    line: false
    point: false
    linestrip: false
    ai_polygon: false
    ai_mask: false
    ai_boundary: false
    watershed_3d: true


shortcuts:
  close: Ctrl+W
  open: Ctrl+O
  open_dir: Ctrl+U
  quit: Ctrl+Q
  save: Ctrl+S
  save_as: Ctrl+Shift+S
  save_to: null
  delete_file: Ctrl+Delete

  open_next: [D, Right]
  open_prev: [A, Left]

  zoom_in: [Ctrl++, Ctrl+=]
  zoom_out: Ctrl+-
  zoom_to_original: Ctrl+0
  fit_window: Ctrl+F
  fit_width: Ctrl+Shift+F

  create_rectangle: Ctrl+R
  create_circle: null
  create_line: null
  create_point: null
  create_linestrip: null
  edit_polygon: Ctrl+J
  delete_polygon: Delete
  duplicate_polygon: Ctrl+D
  copy_polygon: Ctrl+C
  paste_polygon: Ctrl+V
  undo: Ctrl+Z
  undo_last_point: Escape
  redo: Ctrl+Shift+Z
  add_point_to_edge: Ctrl+Shift+P
  edit_label: Ctrl+E
  toggle_keep_prev_mode: Ctrl+P
  remove_selected_point: [Meta+H, Backspace]

  show_all_polygons: null
  hide_all_polygons: null
  toggle_all_polygons: T

  # Mode switch shortcuts
  select_mode: V
  create_brush_mode: B
  erase_mode: E
  create_ai_mask_mode: P
  create_ai_boundary_mode: O
  create_rectangle_mode: M
  create_watershed_3d_mode: T
  escape: Escape

  # View axis shortcuts (disabled - use Axis dropdown to switch views)
  view_axis_axial: null
  view_axis_coronal: null
  view_axis_sagittal: null

  # Label workflow shortcuts
  verify_label: F
  revert_label: R
  reject_label: [Delete, Backspace]
  commit: [Ctrl+Return, Meta+Return]
  hide_verified: H
  solo_label: S
  show_all_labels: Shift+S

  # Search/Focus shortcuts
  focus_label_search: Ctrl+F
  focus_brush_label: Ctrl+L
  set_brush_label_0: "0"

  # 3D shortcuts
  toggle_3d: Ctrl+3
